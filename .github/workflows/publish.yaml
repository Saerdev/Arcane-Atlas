name: Update prices & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Trigger externally via cron-job.org once hourly (configure in cron-job.org).
  # No GitHub Actions schedule is enabled to avoid double refreshes.

permissions:
  contents: write # keep a dormant public repo active so GitHub does not disable scheduled refreshes
  pages: write
  id-token: write

concurrency:
  group: arcane-atlas-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site source
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Generate hourly closed-order statistics snapshot
        env:
          WFM_USER_AGENT: ArcaneAtlas/2.0 (+https://github.com/${{ github.repository }})
        run: python3 scripts/update_prices.py --output site/data/prices.json

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish public site
        id: deployment
        uses: actions/deploy-pages@v5

name: Update prices & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arcane-atlas-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site source
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate fresh prices (Python standard library only)
        env:
          WFM_USER_AGENT: ArcaneAtlas/2.1 (+https://github.com/${{ github.repository }})
        run: python3 scripts/update_prices.py --output site/data/prices.json

      - name: Keep scheduled updates enabled
        if: github.event_name == 'schedule'
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          if (( now - last_commit > 30 * 86400 )); then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --allow-empty -m 'chore: keep price updates scheduled'
            if ! git push origin HEAD:${{ github.ref_name }}; then
              echo '::warning::Could not keep the repository active; check branch protection and Actions permissions.'
            fi
          fi

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish public site
        id: deployment
        uses: actions/deploy-pages@v4
